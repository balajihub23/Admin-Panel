<header class="topbar-container">
  <div class="topbar-left">
    <button type="button" (click)="toggle()" class="collapse-btn" title="Toggle Sidebar">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="22" height="22">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <h2 class="page-title">Admin Panel</h2>
  </div>

  <div class="topbar-right">
    <!-- Search Bar -->
    <div class="search-box">
      <span class="search-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </span>
      <input type="text" placeholder="Search operations..." class="search-input" />
    </div>

    <!-- Notifications Bell Dropdown -->
    <div class="notification-wrapper">
      <button type="button" (click)="toggleNotificationDropdown()" class="notification-btn" title="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="22" height="22">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span class="badge animate-pulse">2</span>
      </button>

      <div class="notification-dropdown premium-card animate-fade-in" *ngIf="showNotificationDropdown">
        <div class="drop-header">
          <h3>Notifications</h3>
          <span class="unread-count">2 New</span>
        </div>
        <ul class="notification-list">
          <li *ngFor="let notif of notifications" class="notif-item" [class.unread]="notif.unread">
            <div class="notif-bullet"></div>
            <div class="notif-content">
              <h4>{{ notif.title }}</h4>
              <p>{{ notif.desc }}</p>
              <span class="notif-time">{{ notif.time }}</span>
            </div>
          </li>
        </ul>
      </div>
    </div>

    <!-- Profile Dropdown Trigger -->
    <div class="profile-wrapper">
      <button type="button" (click)="toggleProfileDropdown()" class="profile-trigger-btn">
        <div class="avatar-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="24" height="24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
          </svg>
        </div>
        <div class="profile-info-text">
          <span class="user-name">{{ userFullName }}</span>
          <span class="user-role-badge" [class]="userRole.toLowerCase()">{{ userRole }}</span>
        </div>
      </button>

      <div class="profile-dropdown premium-card animate-fade-in" *ngIf="showProfileDropdown">
        <div class="drop-user-info">
          <h4>{{ userFullName }}</h4>
          <p>{{ userEmail }}</p>
        </div>
        <hr class="drop-divider" />
        <button type="button" (click)="logout()" class="drop-logout-btn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Logout Session
        </button>
      </div>
    </div>
  </div>
</header>
