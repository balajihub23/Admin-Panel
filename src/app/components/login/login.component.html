<div class="login-wrapper">
  <!-- Glowing backdrops for rich premium look -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="login-card-container">
    <div class="login-card premium-card">
      <div class="card-header">
        <h1 class="card-title">Welcome Back</h1>
        <p class="card-subtitle">Sign in to access the admin dashboard</p>
      </div>

      <!-- Failure Alert Message -->
      <div class="error-banner animate-fade-in" *ngIf="errorMessage">
        <span class="error-bullet"></span>
        <span class="error-msg-text">{{errorMessage}}</span>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
        <!-- Email Input -->
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-container">
            <span class="input-prefix-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </span>
            <input type="email" 
                   name="email" 
                   [(ngModel)]="email" 
                   placeholder="Email address" 
                   required 
                   class="form-control-input"/>
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-container">
            <span class="input-prefix-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            
            <input [type]="showPassword ? 'text' : 'password'" 
                   name="password" 
                   [(ngModel)]="password" 
                   placeholder="Password" 
                   required 
                   class="form-control-input password-input"/>
            
            <button type="button" (click)="togglePasswordVisibility()" class="input-suffix-btn" title="Toggle Password Visibility">
              <!-- Show Eye Suffix -->
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <!-- Hide Eye Suffix -->
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submission Trigger Button -->
        <button type="submit" [disabled]="loading || !email || !password" class="btn btn-login btn-block">
          <span *ngIf="!loading">Login</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>
      </form>

      <div class="card-footer">
        <a routerLink="/forgot-password" class="forgot-link">Forgot password ?</a>
      </div>
    </div>
  </div>
</div>
